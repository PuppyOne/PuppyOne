name: Waka Readme

on:
  schedule:
    # runs at 4 UTC (12 UTC+8)
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    name: WakaReadme DevMetrics
    runs-on: ubuntu-latest
    steps:
      - id: date
        run: echo "today=$(date +%F)" >> $GITHUB_OUTPUT

      - uses: athul/waka-readme@master # this action name
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          COMMIT_MESSAGE: "docs: update waka-readme metrics graph (${{ steps.date.outputs.today }}) 🤖"
          BLOCKS: ⣀⣄⣤⣦⣶⣷⣿
          SHOW_TITLE: true
